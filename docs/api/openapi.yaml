        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/search'
        - { name: status, in: query, schema: { type: string } }
        - { name: planId, in: query, schema: { type: string } }
        - { name: interval, in: query, schema: { type: string, enum: [monthly, yearly] } }
      responses:
        '200': { description: 'Page of { id, vendorId, vendorName, planName, interval, status, cancelAtPeriodEnd, currentPeriodEnd, trialEndsAt, graceEndsAt }' }


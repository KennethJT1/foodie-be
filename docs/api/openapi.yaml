      x-permission: payouts.manage
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/search'
        - { name: status, in: query, schema: { type: string, enum: [draft, approved, paid] } }
        - { name: month, in: query, schema: { type: string, example: '2026-09' } }
      responses:
        '200': { description: Page of payout statements }

  /admin/payouts/{id}/approve:
    post:
      tags: [Admin]
      summary: Approve a draft statement (BR-PAY-06)
      x-permission: payouts.manage
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:

    post:
      tags: [Admin]
      summary: Reply (the user is notified; open → pending) or add an internal note
      x-permission: support.manage
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties: { body: { type: string, maxLength: 2000 }, internal: { type: boolean } }
      responses:
        '200': { description: Ticket }

  /admin/agents:
    get:
      tags: [Admin]
      summary: Admins who can answer tickets (for assignment)
      x-permission: support.manage
      responses:
        '200': { description: 'Array of { id, name }' }

  /admin/settings:
    get:
      tags: [Admin]
      summary: Platform settings
      x-permission: settings.manage
      responses:
        '200': { description: Settings }
    patch:
      tags: [Admin]
      summary: Change fees, payout %, timeouts, trial/grace, refunds, service areas or templates (logged)
      x-permission: settings.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deliveryBaseFee: { type: integer, description: kobo }
                deliveryPerKm: { type: integer, description: kobo }
                deliveryMaxFee: { type: integer, description: kobo }
                riderPayoutPct: { type: number }
                vendorAcceptTimeoutSec: { type: integer }
                riderOfferTimeoutSec: { type: integer }
                trialDays: { type: integer }
                graceDays: { type: integer }
                yearlyDiscountPct: { type: number }
                refundDeadlineHours: { type: integer }
                refundMissedAction: { type: string, enum: [escalate, warn, suspend] }
                serviceAreas: { type: array, items: { type: string } }
                notificationTemplates:
                  type: array
                  items: { type: object, properties: { key: { type: string }, channel: { type: string }, subject: { type: string }, body: { type: string } } }
      responses:
        '200': { description: Settings }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/users:
    get:
      tags: [Admin]
      summary: Admin accounts
      x-permission: admin_users.manage
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/search'
        - { name: adminRole, in: query, schema: { type: string } }
      responses:
        '200': { description: 'Page of { id, name, email, adminRole, status, createdAt }' }
    post:
      tags: [Admin]
      summary: Add an admin (they get an email to set a password)
      x-permission: admin_users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, adminRole]
              properties: { firstName: { type: string }, lastName: { type: string }, email: { type: string }, adminRole: { type: string, enum: [super_admin, support, finance, dispatch, onboarding] } }
      responses:
        '201': { description: Admin }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/users/{id}:
    patch:
      tags: [Admin]
      summary: Change another admin's role or suspend / restore them
      x-permission: admin_users.manage
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { adminRole: { type: string }, status: { type: string, enum: [active, suspended] } } }
      responses:
        '200': { description: Admin }
        '409': { description: You can't change yourself }

  /admin/roles:
    get:
      tags: [Admin]
      summary: Admin sub-roles with their permissions, and every permission there is
      x-permission: admin_users.manage
      responses:
        '200': { description: '{ roles: [{ id, permissions }], permissions: string[] }' }

  /admin/roles/{id}:
    patch:
      tags: [Admin]
      summary: Set a role's permissions (super_admin is locked; dashboard.view is required)
      x-permission: admin_users.manage
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties: { permissions: { type: array, items: { type: string } } }
      responses:
        '200': { description: Role }
        '409': { description: Super admin can't be changed }

  /admin/roles/{id}/reset:
    post:
      tags: [Admin]
      summary: Put a role back to its default permissions
      x-permission: admin_users.manage
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Role }

  /admin/audit-log:
    get:
      tags: [Admin]
      summary: Admin actions and money events
      x-permission: audit_log.view
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/search'
        - { name: actorRole, in: query, schema: { type: string } }
        - { name: targetType, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string, description: prefix match, comma for several } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: 'Page of { id, actorName, actorRole, action, targetType, targetId, summary, ip, createdAt }' }

  /support/tickets:
    get:
      tags: [Support]
      summary: The signed-in user's tickets (internal notes are never returned)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/search'
        - { name: status, in: query, schema: { type: string, enum: [open, pending, resolved, closed] } }
      responses:
        '200': { description: 'Page of { id, number, subject, status, orderCode, lastMessage, hasReply, updatedAt }' }
    post:
      tags: [Support]
      summary: Open a ticket, optionally about one of the user's orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, body]
              properties:
                subject: { type: string, maxLength: 120 }
                body: { type: string, maxLength: 2000 }
                orderId: { type: string }
      responses:
        '201': { description: Ticket }
        '422': { $ref: '#/components/responses/ValidationError' }

  /support/tickets/{id}:
    get:
      tags: [Support]
      summary: One of the user's tickets with the conversation
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Ticket }
        '404': { $ref: '#/components/responses/NotFound' }

  /support/tickets/{id}/messages:
    post:
      tags: [Support]
      summary: Reply on a ticket; a waiting or resolved ticket opens again
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string, maxLength: 2000 } } }
      responses:
        '200': { description: Ticket }
        '409': { description: The ticket is closed }

  /support/tickets/{id}/resolve:
    post:
      tags: [Support]
      summary: The user says their problem is solved
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Ticket (resolved) }

  /orders/{id}/chat:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Support]
      summary: Customer–rider chat for an order (the customer and the assigned rider only)
      responses:
        '200': { description: '{ isOpen, messages: [{ id, senderRole, senderName, body, createdAt }] }' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Support]
      summary: Send a chat message while the order is rider_assigned or picked_up
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string, maxLength: 500 } } }
      responses:
        '201': { description: Message (also pushed as chat:message) }
        '409': { description: Chat is closed for this order }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    sort: { name: sort, in: query, schema: { type: string, example: '-createdAt' } }
    search: { name: search, in: query, schema: { type: string } }
    cursor: { name: cursor, in: query, schema: { type: string } }

  schemas:
    Success:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: {}

    ListSuccess:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { type: array, items: {} }
        meta: { $ref: '#/components/schemas/PageMeta' }

    PageMeta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        hasNextPage: { type: boolean }
        hasPrevPage: { type: boolean }

    CursorMeta:
      type: object
      properties:
        nextCursor: { type: [string, 'null'] }
        limit: { type: integer }

    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string, example: Please check the highlighted fields. }
            fieldErrors:
              type: object
              additionalProperties: { type: string }
              example: { email: Enter a valid email address }

    User:
      type: object
      properties:
        id: { type: string }
        role: { type: string, enum: [customer, vendor, rider, admin] }
        adminRole: { type: string, enum: [super_admin, support, finance, dispatch, onboarding] }
        permissions: { type: array, items: { type: string } }
        firstName: { type: string }
        lastName: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        avatar: { type: [string, 'null'] }
        status: { type: string, enum: [active, suspended, banned] }
        vendor:
          type: object
          description: Present for vendor accounts
          properties:
            id: { type: string }
            slug: { type: string }
            approvalStatus: { type: string, enum: [draft, pending, approved, rejected, suspended] }
            subscriptionStatus: { type: string, enum: [none, trial, active, grace, expired, cancelled] }
        rider:
          type: object
          description: Present for rider accounts
          properties:
            id: { type: string }
            approvalStatus: { type: string }
            isOnline: { type: boolean }

    Category:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        icon: { type: string }
        itemCount: { type: integer }

    FoodItem:
      type: object
      properties:
        id: { type: string }
        vendorId: { type: string }
        categoryId: { type: string }
        name: { type: string }
        description: { type: string, maxLength: 500 }
        price: { type: integer, description: kobo }
        photos: { type: array, items: { type: string, format: uri } }
        portion: { type: string }
        prepTimeMins: { type: integer }
        isAvailable: { type: boolean }
        availableDays: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
        optionGroups:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              required: { type: boolean }
              max: { type: integer }
              options:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    price: { type: integer, description: kobo }
        likesCount: { type: integer }
        commentsCount: { type: integer }
        isLiked: { type: boolean, description: For the signed-in user }
        distanceM: { type: integer }
        vendor:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            slug: { type: string }
            logo: { type: string }
            rating: { type: number }
            isOpen: { type: boolean }
        createdAt: { type: string, format: date-time }

    Vendor:
      type: object
      description: Public storefront fields (no bank details or documents)
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        logo: { type: [string, 'null'] }
        cover: { type: [string, 'null'] }
        description: { type: string, maxLength: 300 }
        rating: { type: number }
        ratingCount: { type: integer }
        followersCount: { type: integer }
        isFollowing: { type: boolean }
        isOpen: { type: boolean, description: Computed from openingHours in Africa/Lagos }
        isPaused: { type: boolean }
        prepTimeMins: { type: integer }
        deliveryRadiusKm: { type: number }
        distanceM: { type: integer }
        address:
          type: object
          properties:
            line1: { type: string }
            area: { type: string }
            city: { type: string }
            state: { type: string }
        openingHours:
          type: array
          items:
            type: object
            properties:
              day: { type: integer, minimum: 0, maximum: 6, description: 0 = Sunday }
              open: { type: string, example: '09:00' }
              close: { type: string, example: '21:00' }
              closed: { type: boolean }

    Comment:
      type: object
      properties:
        id: { type: string }
        foodItemId: { type: string }
        parentId: { type: [string, 'null'] }
        body: { type: [string, 'null'], description: null when removed }
        removed: { type: boolean }
        isVendorReply: { type: boolean }
        isMine: { type: boolean }
        editedAt: { type: [string, 'null'], format: date-time }
        author:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            avatar: { type: [string, 'null'] }
        replies: { type: array, items: { $ref: '#/components/schemas/Comment' } }
        createdAt: { type: string, format: date-time }

    Address:
      type: object
      properties:
        id: { type: string }
        label: { type: string, example: Home }
        line1: { type: string }
        area: { type: string }
        city: { type: string }
        state: { type: string }
        lat: { type: number }
        lng: { type: number }
        directions: { type: string }
        isDefault: { type: boolean }

    AddressInput:
      type: object
      required: [line1, area, city, lat, lng]
      properties:
        label: { type: string }
        line1: { type: string }
        area: { type: string }
        city: { type: string }
        state: { type: string }
        lat: { type: number }
        lng: { type: number }
        directions: { type: string }
        isDefault: { type: boolean }

    CheckoutInput:
      type: object
      required: [vendorId, items]
      properties:
        vendorId: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              foodItemId: { type: string }
              quantity: { type: integer, minimum: 1 }
              optionIds: { type: array, items: { type: string } }
        addressId: { type: string, description: A saved address, or send `address` }
        address: { $ref: '#/components/schemas/AddressInput' }
        scheduledFor:
          type: [string, 'null']
          format: date-time
          description: FR-ORD-07; required when the vendor is closed now

    OrderLine:
      type: object
      properties:
        foodItemId: { type: string }
        name: { type: string }
        photo: { type: [string, 'null'] }
        unitPrice: { type: integer, description: kobo }
        quantity: { type: integer }
        lineTotal: { type: integer, description: kobo }
        options:
          type: array
          items:
            type: object
            properties:
              groupId: { type: string }
              groupName: { type: string }
              optionId: { type: string }
              name: { type: string }
              price: { type: integer }

    Quote:
      type: object
      properties:
        lines: { type: array, items: { $ref: '#/components/schemas/OrderLine' } }
        subtotal: { type: integer }
        deliveryFee: { type: integer }
        processingFee: { type: integer }
        total: { type: integer }
        distanceM: { type: integer }
        etaMins: { type: array, items: { type: integer }, example: [25, 35] }
        isOpen: { type: boolean }
        scheduledFor: { type: [string, 'null'], format: date-time }

    Order:
      type: object
      properties:
        id: { type: string }
        code: { type: string, example: 4F7Q2A }
        status:
          type: string
          enum: [paid, accepted, rejected, preparing, ready_for_pickup, rider_assigned, picked_up, delivered, cancelled]
        customerId: { type: string }
        customerName: { type: string }
        vendorId: { type: string }
        vendorName: { type: string }
        riderId: { type: [string, 'null'] }
        items: { type: array, items: { $ref: '#/components/schemas/OrderLine' } }
        subtotal: { type: integer }
        deliveryFee: { type: integer }
        processingFee: { type: integer }
        total: { type: integer }
        address: { $ref: '#/components/schemas/Address' }
        deliveryNote: { type: string }
        scheduledFor: { type: [string, 'null'], format: date-time }
        deliveryCode: { type: string, description: Only for the customer and admins }
        etaMins: { type: array, items: { type: integer } }
        isActive: { type: boolean }
        statusHistory:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              at: { type: string, format: date-time }
              by: { type: string, enum: [system, customer, vendor, rider, admin] }
        ratedVendor: { type: boolean }
        ratedRider: { type: boolean }
        vendor: { type: object, description: Detail only — name, slug, logo, phone, lat, lng }
        rider: { type: [object, 'null'], description: Detail only — name, phone, vehicle, lat, lng }
        delivery: { type: [object, 'null'], description: Detail only — pickup, dropoff, route }
        payment: { type: [object, 'null'], description: Detail only — reference, channel, status }
        refund: { type: [object, 'null'], description: Detail only — id, status, amount }
        createdAt: { type: string, format: date-time }

    Review:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string }
        targetType: { type: string, enum: [vendor, rider] }
        targetId: { type: string }
        userId: { type: string }
        userName: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 500 }
        reply: { type: [string, 'null'], description: Vendor reply }
        createdAt: { type: string, format: date-time }

    RefundStep:
      type: object
      properties:
        status:
          type: string
          enum: [requested, accepted, rejected, paid, confirmed, disputed, escalated]
        at: { type: string, format: date-time }
        by: { type: string, enum: [system, customer, vendor, admin] }
        note: { type: [string, 'null'] }

    Refund:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string }
        orderCode: { type: string }
        customerId: { type: string }
        customerName: { type: string }
        vendorId: { type: string }
        vendorName: { type: string }
        reason: { type: string }
        details: { type: string }
        amount: { type: integer, description: kobo }
        orderSubtotal: { type: integer, description: kobo }
        photos: { type: array, items: { type: string } }
        status:
          type: string
          enum: [requested, accepted, rejected, paid, confirmed, disputed, escalated]
        deadline: { type: string, format: date-time, description: Vendor must respond by then }
        vendorResponse:
          type: [object, 'null']
          properties:
            decision: { type: string, enum: [accepted, rejected] }
            amount: { type: integer, description: kobo; less than requested = partial }
            reason: { type: [string, 'null'] }
            at: { type: string, format: date-time }
        paymentReference: { type: [string, 'null'] }
        escalated: { type: boolean }
        timeline: { type: array, items: { $ref: '#/components/schemas/RefundStep' } }
        createdAt: { type: string, format: date-time }

    Notification:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [order, refund, social, review, subscription, payout, system] }
        title: { type: string }
        body: { type: string }
        link: { type: [string, 'null'], description: In-app path to open }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    Plan:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        monthlyPrice: { type: integer, description: kobo }
        yearlyPrice: { type: integer, description: 'kobo; 12 × monthly minus the yearly discount' }
        limits:
          type: object
          properties:
            menuItems: { type: [integer, 'null'], description: null = unlimited }
            photosPerItem: { type: integer }
            staff: { type: integer }
        featured: { type: string, enum: [none, occasional, priority] }
        analytics: { type: string, enum: [basic, full, export] }
        isPopular: { type: boolean }
        sortOrder: { type: integer }

    PlanChoice:
      type: object
      required: [planId, interval]
      properties:
        planId: { type: string }
        interval: { type: string, enum: [monthly, yearly] }

    VendorSubscription:
      type: object
      properties:
        status: { type: string, enum: [none, trial, active, grace, expired] }
        trialAvailable: { type: boolean }
        trialDays: { type: integer }
        graceDays: { type: integer }
        subscription:
          type: [object, 'null']
          properties:
            id: { type: string }
            planId: { type: string }
            plan: { $ref: '#/components/schemas/Plan' }
            interval: { type: string, enum: [monthly, yearly] }
            amount: { type: integer, description: kobo per period }
            currentPeriodStart: { type: string, format: date-time }
            currentPeriodEnd: { type: string, format: date-time }
            trialEndsAt: { type: [string, 'null'], format: date-time }
            graceEndsAt: { type: [string, 'null'], format: date-time }
            cancelAtPeriodEnd: { type: boolean }
            scheduledChange:
              type: [object, 'null']
              properties:
                planId: { type: string }
                planName: { type: string }
                interval: { type: string, enum: [monthly, yearly] }

    VendorOnboarding:
      type: object
      properties:
        step: { type: string, enum: [type, business, location, documents, bank, review, submitted] }
        approvalStatus: { type: string, enum: [draft, pending, approved, rejected, suspended] }
        rejectionReason: { type: [string, 'null'] }
        submittedAt: { type: [string, 'null'], format: date-time }
        type: { type: [string, 'null'], enum: [restaurant, home_cook, null] }
        name: { type: string }
        description: { type: string }
        phone: { type: string }
        logo: { type: [string, 'null'] }
        cover: { type: [string, 'null'] }
        address: { type: [object, 'null'] }
        lat: { type: [number, 'null'] }
        lng: { type: [number, 'null'] }
        deliveryRadiusKm: { type: number }
        prepTimeMins: { type: integer }
        documents:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              type: { type: string }
              label: { type: string }
              url: { type: string }
              uploadedAt: { type: string, format: date-time }
        requiredDocuments:
          type: array
          items: { type: object, properties: { type: { type: string }, label: { type: string } } }
        bank:
          type: [object, 'null']
          properties:
            bankCode: { type: string }
            bankName: { type: string }
            accountNumber: { type: string }
            accountName: { type: string }
            verified: { type: boolean }

    MenuItemInput:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        categoryId: { type: string }
        price: { type: integer, description: kobo }
        portion: { type: string }
        prepTimeMins: { type: integer }
        photos: { type: array, items: { type: string }, description: up to the plan's photosPerItem }
        isAvailable: { type: boolean }
        availableDays: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
        availableFrom: { type: [string, 'null'], example: '07:00' }
        availableTo: { type: [string, 'null'], example: '11:00' }
        optionGroups:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              required: { type: boolean }
              max: { type: integer }
              options:
                type: array
                items:
                  type: object
                  properties: { id: { type: string }, name: { type: string }, price: { type: integer } }

    JobOffer:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string }
        orderCode: { type: string }
        riderId: { type: string }
        status: { type: string, enum: [pending, accepted, declined, expired] }
        fee: { type: integer, description: delivery fee in kobo }
        earning: { type: integer, description: the rider's share in kobo }
        distanceM: { type: integer, description: vendor to customer }
        toPickupM: { type: [integer, 'null'], description: rider to vendor }
        pickup: { type: object, properties: { name: { type: string }, area: { type: string }, lat: { type: number }, lng: { type: number } } }
        dropoff: { type: object, properties: { area: { type: string }, city: { type: string }, lat: { type: number }, lng: { type: number } } }
        expiresAt: { type: string, format: date-time, description: 30 seconds after it was sent }

    PlanInput:
      type: object
      properties:
        name: { type: string }
        monthlyPrice: { type: integer, description: kobo }
        limits:
          type: object
          properties:
            menuItems: { type: [integer, 'null'] }
            photosPerItem: { type: integer }
            staff: { type: integer }
        featured: { type: string, enum: [none, occasional, priority] }
        analytics: { type: string, enum: [basic, full, export] }
        isPopular: { type: boolean }
        isRetired: { type: boolean }

  responses:
    Session:
      description: Signed in
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - properties:
                  data:
                    type: object
                    properties:
                      accessToken: { type: string }
                      user: { $ref: '#/components/schemas/User' }
    Unauthenticated:
      description: Not signed in or token expired
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Already exists
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: Too many requests
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: Field errors
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    LikeState:
      description: Like state after the change
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - properties:
                  data:
                    type: object
                    properties:
                      foodItemId: { type: string }
                      isLiked: { type: boolean }
                      likesCount: { type: integer }
    FollowState:
      description: Follow state after the change
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - properties:
                  data:
                    type: object
                    properties:
                      vendorId: { type: string }
                      isFollowing: { type: boolean }
                      followersCount: { type: integer }
